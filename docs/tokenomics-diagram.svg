  <text x="806" y="699" text-anchor="middle" fill="#3b82f6"  font-size="24">&#128142;</text>
  <text x="806" y="720" text-anchor="middle" fill="#3b82f6"  font-size="13" font-weight="700" letter-spacing="1">TREASURY</text>
  <text x="806" y="738" text-anchor="middle" fill="#93c5fd"  font-size="10.5">Operations · Liquidity · Grants</text>

  <!-- ═══════════════════════════════════════ $NRG TOKEN BADGE -->
  <circle cx="1055" cy="370" r="76" fill="url(#g-nrg)" stroke="#b45309" stroke-width="1.5" filter="url(#glow-gold)"/>
  <circle cx="1055" cy="370" r="64" fill="none"        stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,4"/>
  <text x="1055" y="352" text-anchor="middle" fill="#f5c542" font-size="26" font-weight="900" letter-spacing="1">$NRG</text>
  <line x1="1005" y1="362" x2="1105" y2="362" stroke="#78350f" stroke-width="1"/>
  <text x="1055" y="380" text-anchor="middle" fill="#fbbf24" font-size="11">ERC-20 utility token</text>
  <text x="1055" y="397" text-anchor="middle" fill="#fbbf24" font-size="11">Capped emission</text>
  <text x="1055" y="414" text-anchor="middle" fill="#fbbf24" font-size="11">Open market trading</text>

