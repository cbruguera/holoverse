  <!-- ═══════════════════════════════════════════════════════ TITLE -->
  <text x="600" y="34" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700" letter-spacing="2.5">
    HOLOVERSE — TOKEN ECONOMIC SYSTEM
  </text>
  <line x1="200" y1="42" x2="1000" y2="42" stroke="#334155" stroke-width="1"/>

  <!-- ══════════════════════════════════ NODE: EPOCH EMISSIONS ENGINE -->
  <rect x="380" y="54" width="420" height="88" rx="14"
        fill="url(#g-green)" stroke="#10b981" stroke-width="1.5"
        filter="url(#glow-green)"/>
  <text x="590" y="82"  text-anchor="middle" fill="#10b981" font-size="13" font-weight="700" letter-spacing="1">EPOCH EMISSIONS ENGINE</text>
  <text x="590" y="102" text-anchor="middle" fill="#6ee7b7" font-size="11">Daily $NRG pool · Emission = Max(BaseFloor, AdaptiveWeight(RecentBurns))</text>
  <text x="590" y="120" text-anchor="middle" fill="#6ee7b7" font-size="11">Per-universe hard cap · No rollover · Counter-cyclical base floor</text>

  <!-- ════════════════════════════════════════ NODE: UNIVERSE OWNER -->
  <rect x="55" y="268" width="262" height="130" rx="14"
        fill="url(#g-amber)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="186" y="296" text-anchor="middle" fill="#f59e0b"  font-size="13" font-weight="700" letter-spacing="1">UNIVERSE OWNER</text>
  <line x1="75"  y1="304" x2="297" y2="304" stroke="#78350f" stroke-width="1"/>
  <text x="186" y="321" text-anchor="middle" fill="#fcd34d" font-size="10.5">Mints universe NFTs (burn + USDC)</text>
  <text x="186" y="338" text-anchor="middle" fill="#fcd34d" font-size="10.5">Earns $NRG from Epoch pool</text>
  <text x="186" y="355" text-anchor="middle" fill="#fcd34d" font-size="10.5">Sets NPC split % · Invites players</text>
  <text x="186" y="372" text-anchor="middle" fill="#fcd34d" font-size="10.5">Pays evolution &amp; maintenance burns</text>

  <!-- ═════════════════════════════════════════ NODE: UNIVERSE NFT -->
  <rect x="380" y="210" width="430" height="220" rx="14"
        fill="url(#g-purple)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="595" y="238" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="1">UNIVERSE NFT</text>
  <line x1="400" y1="246" x2="790" y2="246" stroke="#4c1d95" stroke-width="1"/>

  <!-- Stage progression badges -->
  <rect x="395" y="255" width="86"  height="26" rx="7" fill="#1e1244" stroke="#6d28d9" stroke-width="1"/>
  <text x="438" y="272"  text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">Cosmic</text>
  <text x="485" y="273"  text-anchor="middle" fill="#6d28d9" font-size="14">›</text>
  <rect x="489" y="255" width="96"  height="26" rx="7" fill="#1e1244" stroke="#6d28d9" stroke-width="1"/>
  <text x="537" y="272"  text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">Biological</text>
  <text x="589" y="273"  text-anchor="middle" fill="#6d28d9" font-size="14">›</text>
  <rect x="593" y="255" width="80"  height="26" rx="7" fill="#1e1244" stroke="#6d28d9" stroke-width="1"/>
  <text x="633" y="272"  text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">Social</text>
  <text x="678" y="273"  text-anchor="middle" fill="#6d28d9" font-size="14">›</text>
  <rect x="681" y="255" width="104" height="26" rx="7" fill="#2e1065" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="733" y="272"  text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="700">Transcendent</text>

  <!-- Complexity Score section -->
  <text x="595" y="306" text-anchor="middle" fill="#a78bfa" font-size="10.5" font-weight="600">Complexity Score determines each universe's share of the Epoch pool</text>
  <text x="595" y="322" text-anchor="middle" fill="#c4b5fd" font-size="10">f ( stage level · species diversity · player-minutes · NPC interactions · economic velocity )</text>

  <!-- Maintenance warning box -->
  <rect x="395" y="335" width="415" height="80" rx="8"
        fill="#1a0840" stroke="#6d28d9" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="602" y="356" text-anchor="middle" fill="#fbbf24" font-size="10.5" font-weight="700">&#9888;  MAINTENANCE BURN  &#9888;</text>
  <text x="602" y="375" text-anchor="middle" fill="#ddd6fe" font-size="10">Owners must burn $NRG each epoch to hold their stage.</text>
  <text x="602" y="392" text-anchor="middle" fill="#ddd6fe" font-size="10">Missed payment &#8594; stage regression  (Transcendent &#8594; Social &#8594; …)</text>
  <text x="602" y="408" text-anchor="middle" fill="#ddd6fe" font-size="10">Stage transitions (evolution) also require a significant $NRG burn.</text>

  <!-- ═══════════════════════════════════════════ NODE: NPC PLAYERS -->
  <rect x="55" y="462" width="262" height="108" rx="14"
        fill="url(#g-cyan)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="186" y="490" text-anchor="middle" fill="#06b6d4"  font-size="13" font-weight="700" letter-spacing="1">NPC PLAYERS</text>
  <line x1="75" y1="498" x2="297" y2="498" stroke="#083344" stroke-width="1"/>
  <text x="186" y="515" text-anchor="middle" fill="#67e8f9" font-size="10.5">No Universe NFT required to enter</text>
  <text x="186" y="532" text-anchor="middle" fill="#67e8f9" font-size="10.5">Invited by owner (or join public universe)</text>
  <text x="186" y="549" text-anchor="middle" fill="#67e8f9" font-size="10.5">Earn $NRG by raising Complexity Score</text>

  <!-- ════════════════════════════════════════════════ NODE: BURN -->
  <rect x="55" y="664" width="240" height="92" rx="14"
        fill="url(#g-red)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="175" y="699" text-anchor="middle" fill="#ef4444" font-size="28">&#128293;</text>
  <text x="175" y="720" text-anchor="middle" fill="#ef4444"  font-size="13" font-weight="700" letter-spacing="1">BURN</text>
  <text x="175" y="738" text-anchor="middle" fill="#fca5a5" font-size="10.5">Permanent — removed from supply</text>

  <!-- ══════════════════════════════════════════ NODE: TREASURY -->
  <rect x="666" y="664" width="280" height="92" rx="14"
