<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="840" viewBox="0 0 1200 840" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">

  <!-- ═══════════════════════════════════════════════════════ DEFS -->
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-green"  markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#10b981"/></marker>
    <marker id="arr-red"    markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#ef4444"/></marker>
    <marker id="arr-blue"   markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#3b82f6"/></marker>
    <marker id="arr-amber"  markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#f59e0b"/></marker>
    <marker id="arr-amber2" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#f59e0b"/></marker>
    <marker id="arr-cyan"   markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#06b6d4"/></marker>
    <marker id="arr-red2"   markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#ef4444"/></marker>

    <!-- Node fill gradients -->
    <linearGradient id="g-green"  x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="g-amber"  x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2d1400"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e0c45"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="g-cyan"   x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#032330"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="g-red"    x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2d0404"/>
      <stop offset="100%" stop-color="#5a0a0a"/>
    </linearGradient>
    <linearGradient id="g-blue"   x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0c1f3a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="g-nrg"    x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a1000"/>
      <stop offset="100%" stop-color="#2d1f00"/>
    </linearGradient>
    <linearGradient id="g-bg"     x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#080c16"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>

    <!-- Glow filter for $NRG badge -->
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════════ BACKGROUND -->
  <rect width="1200" height="840" fill="url(#g-bg)"/>

  <!-- Stars -->
  <circle cx="228" cy="25"  r="1.1" fill="white" opacity="0.30"/>
  <circle cx="1116" cy="89" r="1.0" fill="white" opacity="0.40"/>
  <circle cx="65"  cy="30"  r="0.5" fill="white" opacity="0.22"/>
  <circle cx="142" cy="46"  r="1.1" fill="white" opacity="0.32"/>
