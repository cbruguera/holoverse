  <rect x="298" y="182" width="182" height="36" rx="7" fill="#080c16" fill-opacity="0.92"/>
  <text x="389" y="198" text-anchor="middle" fill="#10b981" font-size="10.5" font-weight="600">$NRG · Proof of Activity</text>
  <text x="389" y="212" text-anchor="middle" fill="#6ee7b7" font-size="10">weighted by Complexity Score</text>

  <!-- 2 ── Owner → NFT  (owns)  AMBER solid -->
  <path d="M 317 316 L 380 316"
        fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="349" y="309" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">owns</text>

  <!-- 3 ── NFT → Owner  (Complexity Score → emission weight)  AMBER dashed -->
