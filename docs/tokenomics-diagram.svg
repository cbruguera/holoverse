  <text x="263" y="429" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">NPC split %</text>
  <text x="263" y="441" text-anchor="middle" fill="#fcd34d" font-size="9.5">smart-contract enforced</text>

  <!-- 5 ── NPC → NFT  (contributes to Complexity Score)  CYAN -->
  <path d="M 317 506 C 385 506 400 465 406 446"
        fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <rect x="326" y="472" width="148" height="30" rx="6" fill="#080c16" fill-opacity="0.92"/>
  <text x="400" y="485" text-anchor="middle" fill="#06b6d4" font-size="10" font-weight="600">contributes to</text>
  <text x="400" y="497" text-anchor="middle" fill="#67e8f9" font-size="10">Complexity Score</text>

  <!-- 6 ── Owner → Burn  (Mint 90% + Evolution + Maintenance)  RED thick -->
  <path d="M 98 398 C 68 530 88 620 118 664"
        fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#arr-red)"/>
  <rect x="6" y="400" width="124" height="54" rx="7" fill="#080c16" fill-opacity="0.94"/>
  <text x="68" y="416" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">Mint: 90% NRG</text>
  <text x="68" y="431" text-anchor="middle" fill="#fca5a5" font-size="10">+ Evolution cost</text>
  <text x="68" y="446" text-anchor="middle" fill="#fca5a5" font-size="10">+ Maintenance burn</text>

  <!-- 7 ── NPC → Burn  (5% tax)  RED dashed -->
  <path d="M 112 570 C 96 624 128 652 148 664"
        fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red2)"/>
  <text x="82" y="626" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">5% tax</text>
  <text x="82" y="638" text-anchor="middle" fill="#fca5a5" font-size="9.5">on NPC payments</text>

  <!-- 8 ── Owner → Treasury  (Mint 10% NRG + 100% USDC)  BLUE -->
  <path d="M 282 362 C 340 500 666 595 748 664"
        fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="388" y="560" width="172" height="34" rx="7" fill="#080c16" fill-opacity="0.94"/>
  <text x="474" y="575" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="600">Mint: 10% NRG</text>
  <text x="474" y="589" text-anchor="middle" fill="#93c5fd" font-size="10">+ 100% USDC fee</text>

  <!-- ════════════════════════════════════════════════════ LEGEND -->
  <rect x="55" y="774" width="1090" height="52" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
  <text x="105" y="793" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">LEGEND</text>

  <!-- Green -->
  <line x1="160" y1="793" x2="184" y2="793" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="192" y="797" fill="#10b981" font-size="10.5">$NRG inflow (emissions)</text>

  <!-- Red solid -->
  <line x1="360" y1="793" x2="384" y2="793" stroke="#ef4444" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="392" y="797" fill="#ef4444" font-size="10.5">Burn / permanent sink</text>

  <!-- Red dashed -->
  <line x1="540" y1="793" x2="564" y2="793" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red2)"/>
  <text x="572" y="797" fill="#fca5a5" font-size="10.5">Tax / indirect burn</text>

  <!-- Blue -->
  <line x1="700" y1="793" x2="724" y2="793" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="732" y="797" fill="#3b82f6" font-size="10.5">Treasury inflow</text>

  <!-- Amber solid -->
  <line x1="860" y1="793" x2="884" y2="793" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="892" y="797" fill="#f59e0b" font-size="10.5">Owner actions</text>

  <!-- Cyan -->
  <line x1="990" y1="793" x2="1014" y2="793" stroke="#06b6d4" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <text x="1022" y="797" fill="#06b6d4" font-size="10.5">NPC actions</text>

  <!-- Second legend row: node types -->
  <rect x="160" y="806" width="12" height="10" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="816" fill="#94a3b8" font-size="10">Emission source</text>
  <rect x="310" y="806" width="12" height="10" rx="2" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="328" y="816" fill="#94a3b8" font-size="10">Player / actor</text>
  <rect x="450" y="806" width="12" height="10" rx="2" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
  <text x="468" y="816" fill="#94a3b8" font-size="10">On-chain asset (NFT)</text>
  <rect x="620" y="806" width="12" height="10" rx="2" fill="#5a0a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="638" y="816" fill="#94a3b8" font-size="10">Permanent sink (burn)</text>
  <rect x="810" y="806" width="12" height="10" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="828" y="816" fill="#94a3b8" font-size="10">Treasury (reserve)</text>

